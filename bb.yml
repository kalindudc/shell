# Work-free bb recipe and capture allowlist. See docs/bb.md before adding keys or plugins.
---
marketplaces:
- name: kalindudc
  source: git:github.com/kalindudc/bb-marketplace@main
plugins:
- agent-commands@kalindudc
- better-browser@kalindudc
- forage@kalindudc
- gruve@kalindudc
- lan-connect@kalindudc
- lineup@kalindudc
- loom@kalindudc
- retitle@kalindudc
- session-log@kalindudc
- shuttle@kalindudc
- switchboard@kalindudc
- update-shelf@kalindudc
- vantage@kalindudc
- bb-autoresearch@bb-community
- tokyo-night@bb-community
- id: burn
  source: git:https://github.com/kalindudc/burn
- id: pi-minions
  source: git:https://github.com/kalindudc/minions
- id: pi-quests
  source: git:https://github.com/kalindudc/quests
enable:
- agent-commands
- better-browser
- forage
- gruve
- lan-connect
- lineup
- loom
- retitle
- session-log
- shuttle
- switchboard
- update-shelf
- vantage
- bb-autoresearch
- tokyo-night
- burn
- pi-minions
- pi-quests
- agent-annotations
- bb--prompt-library
- browser-automation
- inline-vis
- monaco-editor
- navigation
- provider-acp
- provider-claude-code
- provider-codex
- provider-pi
- provider-retry
- theme-preview
- thread-list
- workflows
disable:
- ask-user-question
plugin_settings:
  session-log:
    outputHeadLines: 4
    outputTailLines: 4
    thinkingLines: 20
    expandFailures: true
    showMessages: true
    showThinking: true
    showTools: true
    showHidden: true
    timeFormat: 24h
    tintRows: true
  switchboard:
    density: default
    sectionColour: rail
    view: sections
    needsYouShelf: false
    showArchived: false
    staleDays: 3
    snoozeHour: 10
    treeGuides: true
    statusChips: true
    showAge: true
    showBranch: false
    showPullRequests: true
    infoCard: glance
  gruve:
    accent: orange
    interfaceFont: jetbrains
    codeFont: jetbrains
    fontSize: 16
    corners: square
    prompt: chevron
  forage:
    provider: auto
    profile: auto
    privacyProfile: standard
    allowPaidProviderFallback: false
    maxChars: 30000
    timeoutMs: 20000
    concurrency: 4
    searchCacheTtlMs: 300000
    searchCacheMaxEntries: 128
    allowPrivateNetwork: false
    allowRestrictedThreadCapture: false
    keepActivityLog: true
  lineup:
    recentLimit: 50
  loom:
    doneRecord: summary
    checksSettleMinutes: 15
    checksQueuedMinutes: 5
    checksNearDonePercent: 75
  shuttle:
    syncMinutes: 2
    doneDays: 14
    archiveReviewThreads: true
    autoAgent: false
    inboxRequests: true
    inboxRequestDays: 5
  vantage:
    windowHours: 24
    maxThreads: 200
    badge: true
    toasts: false
  provider-retry:
    maximumWait: 6 hours
  workflows:
    maxActiveRuns: 4
    maxConcurrentAgents: 8
    maxAgentCalls: 100
    totalRunTimeoutMs: 86400000
    retentionDays: 7
    maxNotificationBytes: 16384
settings:
  showKeyboardHints: true
  showGitChanges: true
  steerActiveThreadOnEnter: true
  terminalCopyOnSelect: true
  confirmThreadArchive: true
  showDiagnosticEvents: false
  keepHistoryAfterContextClear: true
  summarizeShellCommands: true
  defaultProviderId: pi
  streamerMode: false
  allowFastServiceTier: true
  telemetryEnabled: true
  managedBranchPrefix: kalindudc/
  idleProviderSessionTimeoutMinutes: 30
  earlyAdopter: false
  showUnhandledProviderEvents: false
completed_turns:
  pi: flat
experiments:
  changelogPreview: true
ui:
  sidebar.organizationMode: chronological
  sidebar.threadGrouping.environment: auto
  sidebar.chronologicalSort: updated
  sidebar.sortDirection: default
  sidebar.sectionOrder:
  - pinned
  - projects
  - threads
  sidebar.manualSectionOrder:
  - pinned
  - sections
  - threads
  sidebar.machineSectionOrder:
  - pinned
  - machines
  - threads
  sidebar.hiddenFooterItems:
  - builtin:mobile
  sidebar.pluginPanelOrder:
  - __bb__/new-thread
  - __bb__/search-threads
  - burn/spend
  - vantage/vantage
  - shuttle/shuttle
  - loom/loom
  - forage/sources
  - bb-autoresearch/studies
  - __bb__/automations
  - __bb__/extensions
  - __bb__/skills
  - theme-preview/preview
  sidebar.visiblePluginPanels:
  - forage/sources
  - shuttle/shuttle
  - loom/loom
  - bb-autoresearch/studies
  - burn/spend
  - vantage/vantage
  - __bb__/new-thread
  - __bb__/extensions
  - __bb__/skills
  - __bb__/automations
  - __bb__/search-threads
  sidebar.navigationProvider: navigation/rail
  sidebar.threadListProvider: switchboard/switchboard
  composer.provider: __automatic__
keyboard: []
theme: plugin:gruve:gruve
ui_capture_allowlist:
  sidebar.sectionOrder:
  - pinned
  - projects
  - threads
  sidebar.manualSectionOrder:
  - pinned
  - sections
  - threads
  sidebar.machineSectionOrder:
  - pinned
  - machines
  - threads
  sidebar.hiddenFooterItems:
  - builtin:mobile
  sidebar.pluginPanelOrder:
  - __bb__/new-thread
  - __bb__/search-threads
  - burn/spend
  - vantage/vantage
  - shuttle/shuttle
  - loom/loom
  - forage/sources
  - bb-autoresearch/studies
  - __bb__/automations
  - __bb__/extensions
  - __bb__/skills
  - theme-preview/preview
  sidebar.visiblePluginPanels:
  - forage/sources
  - shuttle/shuttle
  - loom/loom
  - bb-autoresearch/studies
  - burn/spend
  - vantage/vantage
  - __bb__/new-thread
  - __bb__/extensions
  - __bb__/skills
  - __bb__/automations
  - __bb__/search-threads
