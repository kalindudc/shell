onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui.toast]
delivery = "system"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
# Room for each agent's goal on its own sidebar line.
sidebar_width = 36
sidebar_max_width = 48

# pi agents: row 2 is the session name; row 3 is the cortex task and, for a plan,
# its progress. The herdr-label pi extension reports both
# (~/.pi/agent/extensions/herdr-label). An empty row disappears.
[ui.sidebar.agents.rows_by_agent]
pi = [
  ["state_icon", "workspace", "tab"],
  ["$goal"],
  [{ token = "$cortex", fg = "#d79921", bold = true }, "$progress"],
]

[experimental]
pane_history = true

