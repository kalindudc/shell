# Add a critic by adding an entry. The critique skill reads this file at runtime.
# `model` is the exact id bb's spawn tool accepts (pi's `<provider>/<model id>`, see
# `pi --list-models`) with NO `:<thinking>` suffix: spawn rejects the suffix as an unknown
# model. `thinking` goes in the spawn task's own `thinking` field.
#
# One vendor per critic so votes are independent, and no critic from the vendor of the
# reviewing model, so the critics do not grade their own family's work. Quorum is
# max(2, floor(N/2)+1) distinct models: keep N odd, so a single dissent or a single
# critic that fails to start cannot decide a finding.
#
# Last reviewed 2026-10-30. The Shuttle review presets run the first pass on
# anthropic/claude-opus-5-5, so no Anthropic critic. Each answered a one-word prompt
# through pi on that day (one call each, with its thinking level; USD per 1M tokens in/out):
#   deepseek-v4p1-flash  high   4.5 s   $0.30 / $1.20
#   gpt-6.1-sol          xhigh  4.6 s   $1.60 / $8.00
#   grok-4.7             xhigh  10.5 s  $2.00 / $6.00
# The Fireworks model id itself starts with "fireworks:", so the DeepSeek entry is
# provider/id = fireworks/fireworks:accounts/... . Do not shorten it: the shorter
# fireworks/accounts/... form still resolves, but silently to the dated -1017 build.
critics:
  - model: fireworks/fireworks:accounts/fireworks/models/deepseek-v4p1-flash
    thinking: high
    name: DeepSeek
  - model: openai/gpt-6.1-sol
    thinking: xhigh
    name: GPT
  - model: xai/grok-4.7
    thinking: xhigh
    name: Grok
