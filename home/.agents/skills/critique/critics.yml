# Add a critic by adding an entry. The critique skill reads this file at runtime.
# `model` is the exact id bb's spawn tool accepts (pi's `<provider>/<model id>`, see
# `bb provider models pi`) with NO `:<thinking>` suffix: spawn rejects the suffix as an
# unknown model. `thinking` goes in the spawn task's own `thinking` field.
#
# One vendor per critic so votes are independent, and keep N odd, so a single dissent
# or a single critic that fails to start cannot decide a finding. Quorum is
# max(2, floor(N/2)+1) distinct models. A critic round waits for its slowest critic,
# so per-step latency on real work matters as much as quality.
#
# Avoid a critic from the reviewing model's vendor when another vendor is as good. On
# 2026-11-02 none was: outside Anthropic, Google and OpenAI nothing scored above 54 on
# BenchLeader, Google's Gemini 4 Argon took ~12 s per step on real reviews, and the user
# ruled out Gemini, GLM, DeepSeek and Grok. Fable 5.1 therefore shares a vendor with
# the first pass (anthropic/claude-opus-5-5), so it may share its blind spots; three
# vendors still vote, so no single vendor reaches the quorum alone.
#
# Last reviewed 2026-11-02 on a real finding (PR 45617) through spawn, all three KEEP,
# matching the other critics. Seconds on that finding; BenchLeader index; USD per 1M
# tokens in/out.
#   gpt-6.1-sol       xhigh   68 s  index 67.2  $1.60 / $8.00
#   kimi-k3           high    53 s  index 62.1  $3.00 / $15.00
#   claude-fable-5-1  high    84 s  index 67.1  $8.40 / $42.00  (the most thorough)
# Also measured there: gpt-6.1-terra 40 s (index 65.2, a second OpenAI vote);
# gpt-6-astra 56 s ($8.20 / $41); claude-sonnet-5-5 22 s but shallow (3 tool calls, the
# only dissent of 9); gemini-4-argon 368 s at medium and 102 s at low; glm-5p3 67 s.
# meta/muse-spark is refused by Meta's API (402 billing_not_configured).
# A Fireworks model id itself starts with "fireworks:", so its entry is
# fireworks/fireworks:accounts/... . Do not shorten it: a shorter form can resolve,
# silently, to another build (it did for DeepSeek, to the dated -1017 one).
critics:
  - model: openai/gpt-6.1-sol
    thinking: xhigh
    name: GPT
  - model: fireworks/fireworks:accounts/fireworks/models/kimi-k3
    thinking: high
    name: Kimi
  - model: anthropic/claude-fable-5-1
    thinking: high
    name: Fable
