# Add a new critic by adding a model entry. The critique skill reads this file at runtime.
# Format: <pi provider>/<model id>[:<thinking>] (see `pi --list-models`). One vendor per critic
# so votes are independent. Quorum is max(2, floor(N/2)+1) distinct models: N=3 needs 2, but
# N=2 needs both critics to KEEP.
#
# Last reviewed 2026-10-28. Two frontier-tier reasoning critics, each pinned to its thinking level:
#   deepseek-v4p1-flash:high  (fireworks) -- DeepSeek V4.1 Flash, high thinking
#   gpt-6.1-sol:xhigh         (openai)    -- GPT-6.1 Sol, extra-high thinking
#
# The Fireworks model id itself starts with "fireworks:", so the DeepSeek entry is
# provider/id = fireworks/fireworks:accounts/... . Do not shorten it: the shorter
# fireworks/accounts/... form still resolves, but silently to the dated -1017 build.
critics:
  - model: fireworks/fireworks:accounts/fireworks/models/deepseek-v4p1-flash:high
    name: DeepSeek
  - model: openai/gpt-6.1-sol:xhigh
    name: GPT
