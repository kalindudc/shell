# Add a critic by adding an entry. The critique skill reads this file at runtime.
# `model` is the exact id bb's spawn tool accepts (pi's `<provider>/<model id>`, see
# `bb provider models pi`) with NO `:<thinking>` suffix: spawn rejects the suffix as an
# unknown model. `thinking` goes in the spawn task's own `thinking` field.
#
# One vendor per critic so votes are independent, and no critic from the vendor of the
# reviewing model, so the critics do not grade their own family's work. Quorum is
# max(2, floor(N/2)+1) distinct models: keep N odd, so a single dissent or a single
# critic that fails to start cannot decide a finding. A critic round waits for its
# slowest critic, so speed matters as much as quality.
#
# Last reviewed 2026-11-02. The Shuttle review presets run the first pass on
# anthropic/claude-opus-5-5, so no Anthropic critic. Each critic below judged the same
# five known-answer findings (two real, two planted false claims, one pre-existing)
# through spawn and got all five right. Time is that run; index is BenchLeader's
# (2 Nov 2026); price is USD per 1M tokens in/out.
#   gpt-6.1-sol     xhigh   87 s  index 67.3  $1.60 / $8.00
#   kimi-k3         high    93 s  index 62.1  $3.00 / $15.00
#   gemini-4-argon  medium 124 s  index 66.0  $2.00 / $10.00 until 2026-11-30, then $4 / $20
# Replaced: deepseek-v4p1-flash (index 58.9; 181 s on the same test) and grok-4.7
# (index 58.2; 350 s and 807 s in real burn#5 critic rounds). Also measured:
# glm-5p3 113 s, 5/5 but index 59.0; kimi-k3-fast 89 s for 1.5x Kimi's price;
# gemini-4-argon at high 151 s; gemini-3.8-flash 343 s and 4/5. meta/muse-spark is
# refused by Meta's API (402 billing_not_configured). Qwen3.8 Max takes minutes per answer.
# A Fireworks model id itself starts with "fireworks:", so its entry is
# fireworks/fireworks:accounts/... . Do not shorten it: a shorter form can resolve,
# silently, to another build (it did for DeepSeek, to the dated -1017 one).
critics:
  - model: openai/gpt-6.1-sol
    thinking: xhigh
    name: GPT
  - model: fireworks/fireworks:accounts/fireworks/models/kimi-k3
    thinking: high
    name: Kimi
  - model: google/gemini-4-argon
    thinking: medium
    name: Gemini
