<!doctype html>
<meta charset="utf-8">
<title>Scaled SVG label</title>
<style>
  body { margin: 0; }
  #outer { margin: 40px; transform: scale(0.7); transform-origin: top left; }
  text { font: 11px Arial; }
</style>
<div id="outer"><svg width="160" height="40" viewBox="0 0 160 40"><text id="label" x="0" y="20">Map label</text></svg></div>
