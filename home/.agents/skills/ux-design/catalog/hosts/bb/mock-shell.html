<!doctype html>
<!--
  Mock shell for bb plugin pages (ux-design skill, catalog/hosts/bb/mock-shell.html).
  It is assets/mock-shell.html with bb's frame (nav rail, page sidebar, title bar) and bb's themes.
  Copy it to <work>/mock/index.html and replace the screens inside <main data-page>.
  - Themes: bb tokens captured 2026-11-10 (catalog/hosts/bb/theme-tokens.json). Every colour is a var(--token).
  - Width switch: 1400, 1000, 720, 390 (the frame's width, not the window's).
  - State switch: sets data-state on <html>; mark state variants with data-when="empty" (space-separated list).
  - Screens: <section data-screen="id">; any element with data-go="id" opens it; the hash keeps it (#id).
  - Name each piece's production component with data-part="ComponentName".
  No network requests: keep it that way.
-->
<html lang="en" data-theme="gruve-light" data-state="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock</title>
<style>
:root { --frame-w: 1400px; --frame-h: 900px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #8a8578; font: 13px/1.45 var(--font-sans); color: var(--foreground); }
.mock-bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: #1d1c1a; color: #eee; font: 12px/1.4 ui-monospace, Menlo, monospace; }
.mock-bar label { display: inline-flex; gap: 6px; align-items: center; }
.mock-bar select, .mock-bar button { font: inherit; background: #2c2b28; color: #eee; border: 1px solid #555; padding: 2px 6px; }
.mock-bar .note { opacity: .7; }
.frame { width: var(--frame-w); height: var(--frame-h); margin: 16px auto; display: grid; grid-template-columns: 48px 256px 1fr; background: var(--background); color: var(--foreground); font-family: var(--font-sans); overflow: hidden; box-shadow: 0 0 0 1px #0003; }
.frame.narrow { grid-template-columns: 48px 1fr; }
.frame.narrow .bb-sidebar { display: none; }
.bb-rail { background: var(--sidebar); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 12px; }
.bb-rail i { width: 18px; height: 18px; border: 1.5px solid var(--muted-foreground); display: block; opacity: .6; }
.bb-rail i.on { border-color: var(--primary); opacity: 1; }
.bb-sidebar { background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border); overflow: auto; padding: 12px 8px; }
.bb-pane { display: grid; grid-template-rows: 48px 1fr; min-width: 0; }
.bb-titlebar { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border-seam); font-size: 13px; }
[data-page] { overflow: auto; min-width: 0; }
section[data-screen] { display: none; }
section[data-screen].on { display: block; }
[hidden] { display: none !important; }
a { color: inherit; text-underline-offset: 2px; }
a[aria-current] { color: var(--primary); }
/* Helpers in bb's vocabulary, so the mock reads like the production Tailwind classes. */
.fg { color: var(--foreground); } .muted { color: var(--muted-foreground); } .subtle { color: var(--subtle-foreground); }
.primary { color: var(--primary); } .ok { color: var(--success); } .warn { color: var(--warning-text); } .bad { color: var(--destructive-text); }
.seam { border-color: var(--border-seam); } .card { background: var(--card); }
.hover:hover { background: var(--state-hover); } .selected { background: var(--surface-selected); }
.attention { background: var(--surface-attention); } .danger { background: var(--surface-destructive); }
.btn { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid var(--border-seam); border-radius: var(--radius); background: transparent; color: var(--foreground); font: inherit; font-size: 12px; cursor: pointer; }
.btn:hover { background: var(--state-hover); }
.btn.primary-btn { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); font-weight: 600; }
.btn:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); }
.num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="mock-bar" role="toolbar" aria-label="Mock controls">
  <strong>Mock</strong>
  <label>Theme <select id="theme"></select></label>
  <label>Width <select id="width"><option>1400</option><option>1000</option><option>720</option><option>390</option></select></label>
  <label>State <select id="state"><option>default</option><option>empty</option><option>loading</option><option>error</option><option>stale</option><option>many</option></select></label>
  <span class="note">Screens: <span id="screens"></span></span>
</div>
<div class="frame" id="frame">
  <nav class="bb-rail" aria-label="bb navigation"><i></i><i></i><i class="on"></i><i></i><i></i></nav>
  <aside class="bb-sidebar" data-part="PageSidebar" aria-label="Page navigation">
    <!-- The plugin's experimental_sidebar goes here. -->
    <div class="label">Plugin</div>
    <p class="muted"><a href="#home" data-go="home">Home</a></p>
  </aside>
  <div class="bb-pane">
    <div class="bb-titlebar"><span class="muted">Plugin</span><span class="muted" aria-hidden="true">/</span><span id="crumb">Home</span></div>
    <main data-page>
      <section data-screen="home" data-title="Home">
        <div style="padding:16px">Replace this screen.</div>
        <div data-when="empty" style="padding:16px" class="muted">Nothing here yet: the empty state.</div>
      </section>
    </main>
  </div>
</div>

nt-foreground":"#282828","sidebar-border":"#a89f88","sidebar-search-match":"#e6d9bb","sidebar-ring":"#922d00","--font-terminal":"\"JetBrainsMono Nerd Font Mono\", \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace","--radius":"0px","--radius-sm":"0px","--radius-xl":"0px"}},"gruve-dark":{"label":"gruve dark","className":"dark","tokens":{"--font-sans":"\"JetBrainsMono Nerd Font\", \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace","--font-serif":"Georgia, serif","--font-mono":"\"JetBrainsMono Nerd Font\", \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace","--radius-xs":"0px","--radius-md":"0px","--radius-lg":"0px","--radius-2xl":"1rem","--radius-3xl":"1.5rem","--radius-4xl":"2rem","surface-recessed-solid":"#2a2827","surface-recessed-soft-solid":"#383733","surface-raised-solid":"#363432","canvas":"#32302f","ink":"#ebdbb2","background":"#32302f","foreground":"#ebdbb2","card":"#3c3836","card-foreground":"#ebdbb2","popover":"#3c3836","popover-foreground":"#ebdbb2","primary":"#fe8019","primary-foreground":"#282828","secondary":"#433e3a","secondary-foreground":"#ebdbb2","accent":"#433e3a","accent-foreground":"#ebdbb2","muted":"#45403c","muted-foreground":"#ccbfa0","subtle-foreground":"#b9aa93","readback-foreground":"#c1b49a","version-upgrade":"#e3d3ac","timeline-accent":"#8fb3a5","file-accent":"#8fb3a5","state-hover":"#e6d9b314","state-active":"#eddbb339","destructive":"#fb7c61","destructive-foreground":"#1d2021","destructive-text":"#fd9d85","attention":"#fabd2f","attention-foreground":"#1d2021","warning":"#fe8019","warning-text":"#fda14b","success":"#c3c440","success-foreground":"#c3c440","diff-added":"#b8bb26","pr-merged":"#e5b1b2","brand-discord":"#ebdbb2","diff-removed":"#fd8270","border":"#5a524b","border-hairline":"#504945","border-seam":"#504945","border-seam-vertical":"#504945","input":"#6b6159","ring":"#fe8019","surface-recessed":"#1d202259","surface-raised":"#ffd4aa06","surface-scrim":"#32302feb","surface-destructive":"#ff806614","surface-destructive-border":"#fc7b604d","surface-attention":"#f7bd311f","surface-selected":"#ff84191f","surface-selected-border":"#ff811a59","sidebar":"#2b2928","sidebar-foreground":"#ebdbb2","sidebar-accent":"#3a3634","sidebar-accent-foreground":"#ebdbb2","sidebar-border":"#504945","sidebar-search-match":"#514939","sidebar-ring":"#fe8019","--font-terminal":"\"JetBrainsMono Nerd Font Mono\", \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace","--radius":"0px","--radius-sm":"0px","--radius-xl":"0px"}},"gruvbox-dark":{"label":"gruvbox dark (bb built-in)","className":"dark","tokens":{"--font-sans":"\"JetBrainsMono Nerd Font\", \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace","--font-serif":"Georgia, serif","--font-mono":"\"JetBrainsMono Nerd Font\", \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace","--radius-xs":"0px","--radius-md":"0px","--radius-lg":"0px","--radius-2xl":"1rem","--radius-3xl":"1.5rem","--radius-4xl":"2rem","surface-recessed-solid":"#2a2827","surface-recessed-soft-solid":"#2f2e2d","surface-raised-solid":"#2c2c2b","canvas":"#282828","ink":"#ebdbb2","background":"#282828","foreground":"#ebdbb2","card":"#3c3836","card-foreground":"#ebdbb2","popover":"#3c3836","popover-foreground":"#ebdbb2","primary":"#83a598","primary-foreground":"#282828","secondary":"#433e3a","secondary-foreground":"#ebdbb2","accent":"#433e3a","accent-foreground":"#ebdbb2","muted":"#45403c","muted-foreground":"#aba085","subtle-foreground":"#928a74","readback-foreground":"#9f957d","version-upgrade":"#e2d3ac","timeline-accent":"#83a598","file-accent":"#83a598","state-hover":"#e6d9b314","state-active":"#eddbb339","destructive":"#fb4934","destructive-foreground":"#1d2021","destructive-text":"#fb4934","attention":"#fabd2f","attention-foreground":"#1d2021","warning":"#fe8019","warning-text":"#fe8019","success":"#b8bb26","success-foreground":"#b8bb26","diff-added":"#b8bb26","pr-merged":"#d3869b","brand-discord":"#ebdbb2","diff-removed":"#fb4934","border":"#5a524b","border-hairline":"#504945","border-seam":"#504945","border-seam-vertical":"#504945","input":"#6b6159","ring":"#83a598","surface-recessed":"#1d202259","surface-raised":"#ffd4aa06","surface-scrim":"#282828eb","surface-destructive":"#ff4d3314","surface-destructive-border":"#fc49354d","surface-attention":"#f7bd311f","surface-selected":"#84a5941f","surface-selected-border":"#84a69859","sidebar":"#2b2928","sidebar-foreground":"#ebdbb2","sidebar-accent":"#3a3634","sidebar-accent-foreground":"#ebdbb2","sidebar-border":"#504945","sidebar-search-match":"#494233","sidebar-ring":"#83a598","--font-terminal":"\"JetBrainsMono Nerd Font Mono\", \"JetBrains Mono\", ui-monospace, SFMono-Regular, Menlo, monospace","--radius":"0px","--radius-sm":"0px","--radius-xl":"0px"}}};
const root = document.documentElement;
const themeSel = document.getElementById("theme");
for (const [id, t] of Object.entries(THEMES)) themeSel.add(new Option(t.label, id));
const style = document.createElement("style");
document.head.appendChild(style);
function applyTheme(id) {
  const t = THEMES[id] || Object.values(THEMES)[0];
  const vars = Object.entries(t.tokens).map(([k, v]) => (k.startsWith("--") ? k : "--" + k) + ": " + v).join("; ");
  style.textContent = ":root { " + vars + " }";
  root.dataset.theme = id;
  root.className = t.className;
  localStorage.setItem("mock.theme", id);
}
function applyWidth(w) {
  const frame = document.getElementById("frame");
  root.style.setProperty("--frame-w", w + "px");
  root.style.setProperty("--frame-h", (w <= 390 ? 844 : 900) + "px");
  frame.classList.toggle("narrow", w < 1000);
  localStorage.setItem("mock.width", w);
}
function applyState(s) {
  root.dataset.state = s;
  for (const el of document.querySelectorAll("[data-when]")) el.hidden = !el.dataset.when.split(/\s+/).includes(s);
  for (const el of document.querySelectorAll("[data-unless]")) el.hidden = el.dataset.unless.split(/\s+/).includes(s);
  localStorage.setItem("mock.state", s);
}
function go(id) {
  const screens = [...document.querySelectorAll("section[data-screen]")];
  const target = screens.find((s) => s.dataset.screen === id) || screens[0];
  for (const s of screens) s.classList.toggle("on", s === target);
  document.getElementById("crumb").textContent = target.dataset.title || target.dataset.screen;
  for (const a of document.querySelectorAll("[data-go]")) a.toggleAttribute("aria-current", a.dataset.go === target.dataset.screen);
  if (location.hash.slice(1) !== target.dataset.screen) history.replaceState(null, "", "#" + target.dataset.screen);
}
document.addEventListener("click", (e) => { const a = e.target.closest("[data-go]"); if (a) { e.preventDefault(); go(a.dataset.go); } });
themeSel.onchange = () => applyTheme(themeSel.value);
document.getElementById("width").onchange = (e) => applyWidth(Number(e.target.value));
document.getElementById("state").onchange = (e) => applyState(e.target.value);
document.getElementById("screens").textContent = [...document.querySelectorAll("section[data-screen]")].map((s) => s.dataset.screen).join(", ");
themeSel.value = localStorage.getItem("mock.theme") || Object.keys(THEMES)[0];
document.getElementById("width").value = localStorage.getItem("mock.width") || "1400";
document.getElementById("state").value = localStorage.getItem("mock.state") || "default";
applyTheme(themeSel.value); applyWidth(Number(document.getElementById("width").value)); applyState(document.getElementById("state").value);
go(location.hash.slice(1));
window.addEventListener("hashchange", () => go(location.hash.slice(1)));
</script>
