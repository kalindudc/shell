version: '3'

tasks:
  # Development setup
  up:
    desc: "Install development dependencies (dev tools + Ruby gems)"
    cmds:
      - ./src/scripts/up.sh

  # Installation: every task goes through install.sh, which picks a Ruby that can run src/install
  install:
    desc: "Install everything: packages, tools, setup, generated configs, stow, bb and cortex"
    cmds:
      - ./install.sh

  install:packages:
    desc: "Install the packages.yml lists for this platform, plus npm, pi and pipx packages"
    cmds:
      - ./install.sh packages

  install:tools:
    desc: "Install tools no package manager provides: zsh plugins, starship, herdr, the bb app on Linux, ..."
    cmds:
      - ./install.sh tools

  install:setup:
    desc: "Set up installed tools: docker, GPG signing key, herdr plugins, pi extension dependencies, default shell"
    cmds:
      - ./install.sh setup

  install:bb:
    desc: "Start bb if needed and apply bb.yml"
    cmds:
      - ./install.sh bb

  install:cortex:
    desc: "Install cortex, then its agent skills, pi extension and bb plugin"
    cmds:
      - ./install.sh cortex

  stow:
    desc: "Link home/ into $HOME"
    cmds:
      - ./install.sh stow

  # Clean everything
  clean:
    desc: "Clean all generated files and state"
    cmds:
      - docker compose -f test/integration/docker-compose.yml down -v 2>/dev/null || true
      - rm -f ./tmp/test-*.log
      - echo "✓ Cleaned all generated files and state"

  # Style (lint and fix)
  style:
    desc: "Run ShellCheck linting and auto-fix formatting"
    cmds:
      - shellcheck install.sh home/bin/lib/*.sh
      - |
        for f in home/bin/*; do
          [[ -f "$f" ]] || continue
          if head -1 "$f" | grep -q 'bash'; then
            shellcheck "$f"
          fi
        done
      - |
        if command -v shfmt >/dev/null 2>&1; then
          shfmt -i 2 -w install.sh
          echo "✓ Scripts formatted"
        fi
      - echo "✓ All scripts passed ShellCheck"
      - bundle exec rubocop -A src/install.rb
      - echo "✓ All Ruby files passed RuboCop"

  # Build
  build:
    desc: "Build Docker images for integration tests"
    cmds:
      - |
        if ! docker compose version >/dev/null 2>&1; then
          echo "Error: docker compose not available"
          exit 1
        fi
      - echo "Building integration test images..."
      - docker compose -f test/integration/docker-compose.yml build --parallel
      - echo "✓ All integration test images built successfully"

  build:clean:
    desc: "Rebuild Docker images from scratch (no cache)"
    cmds:
      - |
        if ! docker compose version >/dev/null 2>&1; then
          echo "Error: docker compose not available"
          exit 1
        fi
      - echo "Removing existing images..."
      - docker compose -f test/integration/docker-compose.yml down --rmi all -v 2>/dev/null || true
      - docker image rm -f shell-test:ubuntu-22 shell-test:ubuntu-24 shell-test:arch shell-test:debian shell-test:ubuntu-minimal 2>/dev/null || true
      - echo "Rebuilding all images from scratch..."
      - docker compose -f test/integration/docker-compose.yml build --no-cache --parallel
      - echo "✓ All integration test images rebuilt successfully"

  # Testing
  test:
    desc: "Run default local tests (unit + bin); integration is task test:integration"
    deps:
      - test:unit
      - test:bin

  test:unit:
    desc: "Run unit tests (Ruby installer + pi extensions)"
    cmds:
      - |
        echo "Running Ruby installer unit tests..."
        ruby -e 'Dir.glob("test/unit/test_*.rb").sort.each { |f| require File.expand_path(f) }'
        echo "✓ Ruby installer tests passed"
      - |
        BUN="${HOME}/.bun/bin/bun"
        if ! "$BUN" --version >/dev/null 2>&1; then
          echo "Warning: bun not found at ${BUN}, skipping pi extension tests"
          exit 0
        fi
        EXT_DIR="home/.pi/agent/extensions/custom-tools"
        if [ ! -d "${EXT_DIR}/node_modules" ]; then
          echo "Installing pi extension test dependencies..."
          (cd "${EXT_DIR}" && "$BUN" install)
        fi
        (cd "${EXT_DIR}" && "$BUN" test test/)

  test:bin:
    desc: "Run home/bin/ tool tests (BATS + Ruby)"
    cmds:
      - bats home/bin/test/bats/*.bats
      - ruby -rbundler/setup -e "Dir.glob('home/bin/test/**/*.rb').sort.each { |f| require_relative f }"

  test:integration:
    desc: "Run integration tests with Docker (requires 'task build' first). Use CLI_ARGS to specify platforms: task test:integration -- ubuntu-22 debian"
    cmds:
      - |
        if ! docker compose version >/dev/null 2>&1; then
          echo "Error: docker compose not available"
          exit 1
        fi
      - |
        # Check if images exist
        if ! docker image inspect shell-test:ubuntu-22 >/dev/null 2>&1; then
          echo "Error: Integration test images not built. Run 'task build' first."
          exit 1
        fi
      - test/integration/run-install-test.sh {{.CLI_ARGS}}

  # Generate configs
  generate:
    desc: "Write home/.zshrc, home/.gitconfig and the ghostty font-size config"
    cmds:
      - ./install.sh generate

  generate:zsh:
    desc: "Write home/.zshrc and zsh completions"
    cmds:
      - ./install.sh generate zsh

  generate:git:
    desc: "Write home/.gitconfig"
    cmds:
      - ./install.sh generate git

  generate:ghostty:
    desc: "Write the OS-specific ghostty font-size config"
    cmds:
      - ./install.sh generate ghostty
