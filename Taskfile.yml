version: '3'

vars:
  # Resolved once per run. Points at the user gem bin so bundle/rubocop are
  # always found without root and without needing rbenv initialised.
  GEM_BIN:
    sh: ruby -e 'puts Gem.user_dir + "/bin"'

tasks:
  # Development setup
  up:
    desc: "Install development dependencies (Ruby gems, npm, git hooks); dev tools come from nix develop"
    cmds:
      - ./src/scripts/up.sh

  # Installation
  install:
    desc: "Set up this machine: Nix, the flake, then tools, setup, bb and cortex"
    cmds:
      - ./install.sh {{.CLI_ARGS}}

  switch:
    desc: "Apply the flake (nix-darwin on macOS, Home Manager on Linux); -- personal|work picks the Mac profile"
    cmds:
      - ./src/scripts/switch.sh {{.CLI_ARGS}}

  update:
    desc: "Update the flake inputs (nixpkgs, nix-darwin, Home Manager), then run task switch"
    cmds:
      - nix flake update

  check:
    desc: "Evaluate every configuration and build this system's checks"
    cmds:
      - nix flake check

  tools:
    desc: "Install npm, pi and pipx packages, herdr plugins, and the bb AppImage on Linux"
    cmds:
      - ruby src/install.rb tools

  setup:
    desc: "Set up the GPG signing key, pi extension dependencies and SKILL_NOTES.md templates"
    cmds:
      - ruby src/install.rb setup

  # bb
  bb:
    desc: "Start bb if needed and apply bb.yml (marketplaces, plugins, settings)"
    cmds:
      - ruby src/install.rb bb

  bb:automations:
    desc: "Restore saved bb automations from bb/automations and the private repo; -- --update also overwrites changed ones"
    cmds:
      - ruby src/install.rb --bb-automations {{.CLI_ARGS}}

  bb:automations:export:
    desc: "Save every bb automation: already-public ones to bb/automations, the rest to the private repo"
    cmds:
      - ruby src/install.rb --bb-automations-export

  check:leaks:
    desc: "Fail if the public bb automation backup holds personal ids, tokens or work terms"
    cmds:
      - ruby src/scripts/check-leaks.rb

  cortex:
    desc: "Install cortex, then its agent skills, pi extension and bb plugin"
    cmds:
      - ruby src/install.rb cortex

  # Clean everything
  clean:
    desc: "Remove test logs"
    cmds:
      - rm -f ./tmp/test-*.log
      - echo "✓ Cleaned"

  # Style (lint and fix)
  style:
    desc: "Run ShellCheck linting and auto-fix formatting"
    cmds:
      - shellcheck install.sh src/scripts/*.sh home/bin/lib/*.sh
      - |
        for f in home/bin/*; do
          [[ -f "$f" ]] || continue
          if head -1 "$f" | grep -q 'bash'; then
            shellcheck "$f"
          fi
        done
      - |
        if command -v shfmt >/dev/null 2>&1; then
          shfmt -i 2 -w install.sh
          echo "✓ Scripts formatted"
        fi
      - echo "✓ All scripts passed ShellCheck"
      - bundle exec rubocop -A src/install.rb
      - echo "✓ All Ruby files passed RuboCop"
      - nix fmt
      - echo "✓ Nix files formatted"

  # Testing
  test:
    desc: "Run the local tests (unit + bin); `task check` tests the Nix configurations"
    deps:
      - test:unit
      - test:bin

  test:unit:
    desc: "Run unit tests (Ruby installer + pi extensions)"
    cmds:
      - |
        echo "Running Ruby installer unit tests..."
        bundle exec ruby test/unit/test_installer.rb
        bundle exec ruby test/unit/test_bb.rb
        bundle exec ruby test/unit/test_bb_app.rb
        bundle exec ruby test/unit/test_bb_automations.rb
        bundle exec ruby test/unit/test_leak_check.rb
        ruby src/scripts/check-leaks.rb
        bundle exec ruby test/unit/test_cortex.rb
        echo "✓ Ruby installer tests passed"
      - |
        BUN="${HOME}/.bun/bin/bun"
        if ! "$BUN" --version >/dev/null 2>&1; then
          echo "Warning: bun not found at ${BUN}, skipping pi extension tests"
          exit 0
        fi
        EXT_DIR="home/.pi/agent/extensions/custom-tools"
        if [ ! -d "${EXT_DIR}/node_modules" ]; then
          echo "Installing pi extension test dependencies..."
          (cd "${EXT_DIR}" && "$BUN" install)
        fi
        (cd "${EXT_DIR}" && "$BUN" test test/)

  test:bin:
    desc: "Run home/bin/ tool tests (BATS + Ruby)"
    cmds:
      - bats home/bin/test/bats/*.bats
      - bundle exec ruby -e "Dir.glob('home/bin/test/**/*.rb').sort.each { |f| require_relative f }"
