# Packages for `task install:packages`, listed per package manager. src/install/platform.rb
# picks the lists: macOS brew and brew_cask; Arch pacman, yay and flatpak; Ubuntu and Debian
# apt, snap and flatpak; then npm, pi and pipx everywhere. yay, snap and flatpak are skipped
# when they are not installed, so only list in yay what the Arch repositories lack.
# src/install/tools.rb installs what no list has.

pacman:
  - git
  - curl
  - wget
  - stow
  - ruby
  - gnupg
  - bc
  - zsh
  - atuin
  - ripgrep
  - fd
  - direnv
  - neovim
  - gcc
  - jq
  - go
  - docker
  - fnm
  - base-devel
  - xclip
  - flatpak
  - gum
  - python-pipx
  - github-cli
  - go-task
  - git-delta
  - zoxide
  - ghostty
  - starship
  - kubectl
  - helm
  - docker-compose
  - lazygit
  - ttf-hack-nerd
  - ttf-firacode-nerd
  - ttf-jetbrains-mono-nerd
  - ttf-meslo-nerd
  - ttf-sourcecodepro-nerd
  - ttf-cascadia-mono-nerd

# Microsoft's build; the Arch repositories only have the open-source `code`
yay:
  - visual-studio-code-bin

apt:
  - git
  - gh
  - curl
  - wget
  - stow
  - ruby
  - gnupg
  - bc
  - zsh
  - ripgrep
  - fd-find
  - direnv
  - neovim
  - gcc
  - jq
  - docker.io
  - xclip
  - build-essential
  - libssl-dev
  - zlib1g-dev
  - libbz2-dev
  - libreadline-dev
  - libsqlite3-dev
  - libncursesw5-dev
  - xz-utils
  - tk-dev
  - libxml2-dev
  - libxmlsec1-dev
  - libffi-dev
  - liblzma-dev
  - python3-pipx
  - unzip
  - flatpak

brew:
  - git
  - curl
  - wget
  - stow
  - ruby
  - gnupg
  - zsh
  - fzf
  - atuin
  - ripgrep
  - fd
  - direnv
  - zoxide
  - neovim
  - gh
  - gcc
  - go-task
  - git-delta
  - jq
  - go
  - starship
  - fnm
  - lazygit
  - pipx
  - 1password-cli
  - kubectl
  - helm
  - herdr
  - gum

brew_cask:
  - docker
  - visual-studio-code
  - google-chrome
  - discord
  # Linux gets the AppImage from install_bb_appimage; bb.yml holds its plugins and settings
  - bb
  - font-hack-nerd-font
  - font-fira-code-nerd-font
  - font-jetbrains-mono-nerd-font
  - font-meslo-lg-nerd-font
  - font-sauce-code-pro-nerd-font
  - font-caskaydia-mono-nerd-font

snap:
  - name: code
    classic: true
  - name: task
    classic: true
  - name: kubectl
    classic: true
  - name: helm
    classic: true
  - name: ghostty
    classic: true

flatpak:
  - com.google.Chrome
  - com.discordapp.Discord
  - com.spotify.Client

npm:
  - "@earendil-works/pi-coding-agent"
  # builds cortex from source (src/install/cortex.rb)
  - pnpm

# pi packages, added with `pi install` once npm has installed pi
pi:
  - https://github.com/kalindudc/minions
  - https://github.com/kalindudc/quests

pipx:
  - dunk
