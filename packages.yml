# Packages that Nix does not install, applied by `task tools` (src/install/tools.rb).
# Command-line tools are in nix/home/packages.nix, and macOS apps in nix/darwin/default.nix.

npm:
  - "@earendil-works/pi-coding-agent"
  # builds cortex from source (src/install/cortex.rb)
  - pnpm

# pi packages, added with `pi install` once npm has installed pi
pi:
  - https://github.com/kalindudc/minions
  - https://github.com/kalindudc/quests

pipx:
  - dunk
